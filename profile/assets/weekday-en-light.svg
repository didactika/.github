<g class="fade" style="--d:0.42s"><text x="520" y="211.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="end">18</text></g>
