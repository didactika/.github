<text x="0" y="211.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="start">Sun</text>
<rect x="135" y="202" width="323" height="11" rx="5" fill="#e1e0d9"/>
