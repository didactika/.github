name: Update organisation profile

# Regenerates the charts and README blocks from live GitHub data.
# GitHub profile READMEs cannot run JavaScript, so "dynamic" means this job
# recomputes the numbers on a schedule and commits the result.
#
# The generator itself lives in didactika/profile-generator, not here — this
# repo only supplies the content and receives the output. A change pushed to
# profile-generator's main has no push trigger into this repo (that would need
# a cross-repo token), so it takes effect on the next scheduled run, at most
# 8 hours later, or immediately via a manual "Run workflow".

on:
  schedule:
    - cron: "17 */8 * * *" # every 8 hours, at :17 past
  workflow_dispatch: # manual run from the Actions tab
  push:
    branches: [main]
    paths:
      - "profile/data/content.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Check out the generator
        uses: actions/checkout@v7
        with:
          repository: didactika/profile-generator
          path: profile-generator

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Generate profile
        env:
          # The default token can read the org's public repos, which is all the
          # generator needs. Swap for a PAT only if private repos should count.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node profile-generator/generate-profile.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- profile; then
            echo "Profile already up to date."
            exit 0
          fi
          git add profile
          git commit -m "chore(profile): refresh stats [skip ci]"
          git push
