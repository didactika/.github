<text x="0" y="99.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="start">Wed</text>
<rect x="135" y="90" width="323" height="11" rx="5" fill="#e1e0d9"/>
<rect class="bar" style="--d:0.14s" x="135" y="90" width="217.3" height="11" rx="5" fill="#0d9488"/>
